# Second slot so generation always exercises a real two-player multiworld.
# Historically the enemizer-off slot of bb-archipelago#149; the option itself
# was removed in #150 (enemization is a launch-time decision, not a seed term).
description: Bloodborne second slot
name: NoEnemizer
game: Bloodborne
Bloodborne:
  progression_balancing: 50
  accessibility: items
  auto_upgrade: false
  auto_equip: false
  # bb-archipelago#205: exactly one generating slot turns the option on, so the
  # generation leg exercises the Uncanny pool while the other slot stays the
  # option-off control.
  uncanny_weapons: true
  randomize_starting_weapons: true
  remove_weapon_requirements: true
  goal: moon_presence
