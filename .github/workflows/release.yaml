name: release

# Tag-triggered player prerelease: pushing v* (e.g. v0.1.0-beta.1) builds
# the full Windows launcher package -- launcher, native tools, CE table, and
# the bb-ap-client built from the client repo's main -- and attaches the zip
# plus bloodborne.apworld to a GitHub prerelease, so a playtester needs no
# GitHub login to download.
#
# The suppression binder is built here too, from the committed inputs bundle
# (#138/#164), held to the world's plan pin, and bundled into the zip via
# -SuppressionBuild -- so the prerelease is self-contained. The binder is
# licensed-game-derived; this repository already commits the same data in
# research/bb_inputs.db, so the zip adds no new exposure.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.1.0-beta.1)"
        required: true
      client_ref:
        description: "from-software-archipelago-clients ref to build (blank: the pin in packaging/client-ref.txt)"
        default: ""
      scan_only:
        description: "Rescan an existing release without rebuilding it"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    name: player prerelease package
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.scan_only }}
    runs-on: windows-latest
    environment: release-signing
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the release tag
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ("${{ github.ref_type }}" -eq "tag") { $tag = "${{ github.ref_name }}" }
          if (-not $tag.StartsWith("v")) { throw "release tags must start with v: $tag" }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Fetch the pinned SoulsFormatsNEXT packaging dependency
        shell: pwsh
        run: |
          git clone https://github.com/4laric/SoulsFormatsNEXT.git _soulsformats
          git -C _soulsformats checkout 7cef52a7366678448d85930eeb8e94093b179d24

      # The client commit a release ships is chosen in this repository, in a
      # reviewed commit: packaging/client-ref.txt. A manual dispatch may
      # override it for an experiment; the package manifest records whichever
      # was used.
      - name: Resolve the pinned AP client ref
        id: client-pin
        shell: pwsh
        run: |
          $pin = (Get-Content -LiteralPath packaging/client-ref.txt -Raw).Trim()
          if ($pin -notmatch '^[0-9a-f]{40}$') { throw "packaging/client-ref.txt must hold one full commit SHA, found '$pin'" }
          $override = "${{ github.event.inputs.client_ref }}"
          $ref = if ($override) { $override } else { $pin }
          "pin=$pin" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "ref=$ref" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Check out the AP client
        uses: actions/checkout@v4
        with:
          repository: 4laric/from-software-archipelago-clients
          ref: ${{ steps.client-pin.outputs.ref }}
          path: _client

      - name: Resolve the AP client build stamp
        id: client-sha
        shell: pwsh
        run: |
          $sha = git -C _client rev-parse HEAD
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if (-not "${{ github.event.inputs.client_ref }}" -and $sha -ne "${{ steps.client-pin.outputs.pin }}") {
            throw "checked-out client $sha is not the pinned ${{ steps.client-pin.outputs.pin }}"
          }

      - name: Build the AP client (cargo release)
        shell: pwsh
        env:
          BB_BUILD_SHA: ${{ steps.client-sha.outputs.sha }}
          BB_RELEASE_VERSION: ${{ env.RELEASE_TAG }}
        run: cargo build --release -p bb-archipelago --manifest-path _client/Cargo.toml

      - name: The built client carries the commit it was built from
        shell: pwsh
        run: |
          $version = & _client\target\release\bb-ap-client.exe --version
          $stamp = "${{ steps.client-sha.outputs.sha }}".Substring(0, 12)
          if ($version -notmatch [regex]::Escape($stamp)) { throw "client --version '$version' does not carry build stamp $stamp" }
          Write-Host "client $version"

      - name: Install the pinned Windows packager
        run: python -m pip install --disable-pip-version-check -r packaging/requirements-build.txt

      - name: Build the suppression binder from the inputs bundle
        shell: pwsh
        run: |
          python tools/bb_inputs.py --verify
          python tools/bb_inputs.py --extract work/inputs
          ./tools/build_vanilla_suppression.ps1 `
            -GameParam work/inputs/parambnd/gameparam.parambnd.dcx `
            -Paramdef work/inputs/parambnd/paramdef.paramdefbnd.dcx `
            -OutputRoot work/release-binder `
            -SoulsFormatsNextRoot $PWD\_soulsformats `
            -Apply
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: The binder plan matches the pin the world ships
        shell: pwsh
        run: python tools/check_suppression_plan_pin.py --manifest work/release-binder/build-manifest.json

      - name: Build the launcher package
        shell: pwsh
        run: >-
          ./packaging/build_launcher.ps1
          -SoulsFormatsNextRoot $PWD\_soulsformats
          -ClientPath $PWD\_client\target\release\bb-ap-client.exe
          -ClientRef ${{ steps.client-sha.outputs.sha }}
          -SuppressionBuild $PWD\work\release-binder
          -ReleaseVersion $env:RELEASE_TAG
          -NoArchive

      - name: Packaging smoke - the frozen launcher loads every apworld table and finds its tools
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath "$PWD\build\BloodborneAPLauncher\BloodborneAPLauncher.exe" `
            -ArgumentList @("--self-check", "$PWD\work\self-check.json") `
            -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path work\self-check.json) { Get-Content work\self-check.json }
            throw "launcher self-check failed with exit code $($process.ExitCode)"
          }
          $report = Get-Content work\self-check.json -Raw | ConvertFrom-Json
          if (-not $report.ok) { Get-Content work\self-check.json; throw "launcher self-check reported problems" }
          Get-Content work\self-check.json
      - name: Packaging smoke - the built client accepts the widest contract this apworld emits
        shell: pwsh
        run: |
          python tools/export_runtime_contract.py --output work\contract.json
          & "$PWD\build\BloodborneAPLauncher\tools\bb-ap-client.exe" --check-contract "$PWD\work\contract.json"
          if ($LASTEXITCODE -ne 0) { throw "the built client refuses or would park items from the built apworld's contract" }
      - name: Verify Windows version metadata
        shell: pwsh
        run: >-
          ./packaging/verify_version_metadata.ps1
          -PackageRoot $PWD\build\BloodborneAPLauncher
          -ReleaseVersion $env:RELEASE_TAG

      - name: Azure login for Artifact Signing
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticode-sign first-party executables
        uses: azure/artifact-signing-action@c0ae2c1d0c1847ab81ac0ab8521bee597cfedd30
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: |
            ${{ github.workspace }}\build\BloodborneAPLauncher\BloodborneAPLauncher.exe
            ${{ github.workspace }}\build\BloodborneAPLauncher\tools\bb-ap-client.exe
            ${{ github.workspace }}\build\BloodborneAPLauncher\tools\BBEnemizerPlanner\BBEnemizerPlanner.exe
            ${{ github.workspace }}\build\BloodborneAPLauncher\tools\BBEnemizerWriter.exe
            ${{ github.workspace }}\build\BloodborneAPLauncher\tools\BBSuppressionWriter.exe
            ${{ github.workspace }}\build\BloodborneAPLauncher\tools\BBToastWriter.exe
            ${{ github.workspace }}\build\BloodborneAPLauncher\tools\BBEventWriter.exe
            ${{ github.workspace }}\build\BloodborneAPLauncher\tools\MSBBMiner.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify signatures and create the final signed archive
        shell: pwsh
        run: |
          $package = Join-Path $PWD "build\BloodborneAPLauncher"
          $catalog = @(
            "BloodborneAPLauncher.exe",
            "tools\bb-ap-client.exe",
            "tools\BBEnemizerPlanner\BBEnemizerPlanner.exe",
            "tools\BBEnemizerWriter.exe",
            "tools\BBSuppressionWriter.exe",
            "tools\BBToastWriter.exe",
            "tools\BBEventWriter.exe",
            "tools\MSBBMiner.exe"
          )
          $expected = $env:EXPECTED_SIGNER_SUBJECT
          foreach ($relative in $catalog) {
            $path = Join-Path $package $relative
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Signing catalog file is missing: $relative"
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne "Valid") {
              throw "Authenticode verification failed for ${relative}: $($signature.Status) $($signature.StatusMessage)"
            }
            if (-not $signature.TimeStamperCertificate) {
              throw "Authenticode timestamp is missing for $relative"
            }
            if ($expected -and $signature.SignerCertificate.Subject -ne $expected) {
              throw "Unexpected signer for ${relative}: $($signature.SignerCertificate.Subject)"
            }
            Write-Host "VERIFIED $relative | $($signature.SignerCertificate.Subject) | timestamp $($signature.TimeStamperCertificate.Subject)"
          }

          # Signing changes executable bytes, so refresh the package's own hash inventory before
          # creating the ZIP that will be hashed, attested, released, and submitted to VirusTotal.
          $manifestPath = Join-Path $package "package-manifest.json"
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $manifest.files = @(
            Get-ChildItem -LiteralPath $package -File -Recurse |
              Where-Object FullName -ne $manifestPath |
              Sort-Object FullName |
              ForEach-Object {
                [ordered]@{
                  path = $_.FullName.Substring($package.Length + 1).Replace("\", "/")
                  size = $_.Length
                  sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                }
              }
          )
          $client = Join-Path $package "tools\bb-ap-client.exe"
          $manifest.client.sha256 = (Get-FileHash -LiteralPath $client -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
            $manifestPath,
            ($manifest | ConvertTo-Json -Depth 8),
            [Text.UTF8Encoding]::new($false)
          )
          Compress-Archive -LiteralPath $package `
            -DestinationPath "build\BloodborneAPLauncher-win-x64.zip" `
            -CompressionLevel Optimal
        env:
          EXPECTED_SIGNER_SUBJECT: ${{ vars.ARTIFACT_SIGNING_EXPECTED_SUBJECT }}

      - name: Package the apworld
        shell: pwsh
        run: ./build.ps1 -Apworld

      - name: Attest the release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            build/BloodborneAPLauncher-win-x64.zip
            build/bloodborne.apworld

      - name: Hash the release artifacts
        shell: pwsh
        run: |
          $lines = @("", "## Artifact hashes (SHA-256, built by this workflow run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID)")
          foreach ($f in "build\BloodborneAPLauncher-win-x64.zip","build\bloodborne.apworld") {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            $lines += "``$h``  $(Split-Path $f -Leaf)"
          }
          Add-Content packaging\PACKAGE-README.txt ($lines -join "`n")

      - name: Publish the prerelease with the package zip
        shell: pwsh
        run: |
          # A moved prerelease tag rebuilds the same release. Keep its existing
          # downloads until signing, smoke checks, attestation and hashing pass.
          gh release view "$env:RELEASE_TAG" --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" --repo ${{ github.repository }} `
              build/BloodborneAPLauncher-win-x64.zip build/bloodborne.apworld --clobber
            if ($LASTEXITCODE -ne 0) { throw "Replacing prerelease artifacts failed" }
            gh release edit "$env:RELEASE_TAG" --repo ${{ github.repository }} `
              --notes-file packaging/PACKAGE-README.txt
            if ($LASTEXITCODE -ne 0) { throw "Updating prerelease hashes failed" }
          } else {
            gh release create "$env:RELEASE_TAG" --repo ${{ github.repository }} `
              --title "Bloodborne Archipelago $env:RELEASE_TAG" `
              --notes-file packaging/PACKAGE-README.txt --prerelease `
              build/BloodborneAPLauncher-win-x64.zip build/bloodborne.apworld
            if ($LASTEXITCODE -ne 0) { throw "Creating prerelease failed" }
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  virustotal:
    name: publish VirusTotal results
    needs: package
    if: ${{ always() && (needs.package.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.scan_only)) }}
    runs-on: windows-latest
    continue-on-error: true
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
    steps:
      - name: Resolve the release tag
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ("${{ github.ref_type }}" -eq "tag") { $tag = "${{ github.ref_name }}" }
          if (-not $tag.StartsWith("v")) { throw "release tags must start with v: $tag" }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: VirusTotal API key is not configured
        if: env.VIRUSTOTAL_API_KEY == ''
        shell: pwsh
        run: Write-Warning "Skipping VirusTotal publication because VIRUSTOTAL_API_KEY is unavailable."

      - name: Scan release artifacts and publish permalinks
        if: env.VIRUSTOTAL_API_KEY != ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path scan -Force | Out-Null
          gh release download "$env:RELEASE_TAG" `
            --repo "${{ github.repository }}" `
            --dir scan `
            --pattern BloodborneAPLauncher-win-x64.zip `
            --pattern bloodborne.apworld

          $archive = Join-Path $PWD "scan\BloodborneAPLauncher-win-x64.zip"
          $expanded = Join-Path $PWD "scan\expanded"
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          $scanTargets = @(
            [pscustomobject]@{ Label = "BloodborneAPLauncher-win-x64.zip"; Path = $archive },
            [pscustomobject]@{ Label = "bloodborne.apworld"; Path = (Join-Path $PWD "scan\bloodborne.apworld") },
            [pscustomobject]@{ Label = "BloodborneAPLauncher.exe"; Path = (Join-Path $expanded "BloodborneAPLauncher\BloodborneAPLauncher.exe") },
            [pscustomobject]@{ Label = "tools/bb-ap-client.exe"; Path = (Join-Path $expanded "BloodborneAPLauncher\tools\bb-ap-client.exe") },
            [pscustomobject]@{ Label = "tools/BBEnemizerPlanner/BBEnemizerPlanner.exe"; Path = (Join-Path $expanded "BloodborneAPLauncher\tools\BBEnemizerPlanner\BBEnemizerPlanner.exe") },
            [pscustomobject]@{ Label = "tools/BBSuppressionWriter.exe"; Path = (Join-Path $expanded "BloodborneAPLauncher\tools\BBSuppressionWriter.exe") },
            [pscustomobject]@{ Label = "tools/BBEnemizerWriter.exe"; Path = (Join-Path $expanded "BloodborneAPLauncher\tools\BBEnemizerWriter.exe") },
            [pscustomobject]@{ Label = "tools/BBToastWriter.exe"; Path = (Join-Path $expanded "BloodborneAPLauncher\tools\BBToastWriter.exe") },
            [pscustomobject]@{ Label = "tools/BBEventWriter.exe"; Path = (Join-Path $expanded "BloodborneAPLauncher\tools\BBEventWriter.exe") },
            [pscustomobject]@{ Label = "tools/MSBBMiner.exe"; Path = (Join-Path $expanded "BloodborneAPLauncher\tools\MSBBMiner.exe") }
          )
          foreach ($target in $scanTargets) {
            if (-not (Test-Path -LiteralPath $target.Path -PathType Leaf)) {
              throw "VirusTotal scan target is missing: $($target.Label) ($($target.Path))"
            }
          }

          $headers = @{ "x-apikey" = $env:VIRUSTOTAL_API_KEY }
          $lines = @("", "## VirusTotal")
          foreach ($target in $scanTargets) {
            $path = Get-Item -LiteralPath $target.Path
            if ($path.Length -gt 32MB) {
              $uploadUrl = (Invoke-RestMethod `
                -Uri "https://www.virustotal.com/api/v3/files/upload_url" `
                -Headers $headers).data
            } else {
              $uploadUrl = "https://www.virustotal.com/api/v3/files"
            }

            # PowerShell 7.5's multipart encoder produced a body VirusTotal
            # rejected as malformed for the signed large-file upload URL.
            # curl's file form encoder is available on windows-latest and is
            # also the request shape documented by VirusTotal.
            $uploadJson = & curl.exe `
              --silent `
              --show-error `
              --fail-with-body `
              --request POST `
              --url $uploadUrl `
              --header "x-apikey: $env:VIRUSTOTAL_API_KEY" `
              --form "file=@$($path.FullName)"
            if ($LASTEXITCODE -ne 0) {
              throw "VirusTotal upload failed for $($path.Name) (curl exit $LASTEXITCODE)"
            }
            $upload = $uploadJson | ConvertFrom-Json
            if (-not $upload.data.id) {
              throw "VirusTotal upload returned no analysis id for $($path.Name)"
            }
            $analysisId = $upload.data.id
            $analysis = $null
            # Keep the public API cadence below four requests per minute even
            # when an analysis completes on the first poll.
            Start-Sleep -Seconds 16
            for ($attempt = 1; $attempt -le 12; $attempt++) {
              $analysis = Invoke-RestMethod `
                -Uri "https://www.virustotal.com/api/v3/analyses/$analysisId" `
                -Headers $headers
              if ($analysis.data.attributes.status -eq "completed") { break }
              Start-Sleep -Seconds 15
            }

            $sha256 = (Get-FileHash $path.FullName -Algorithm SHA256).Hash.ToLower()
            $permalink = "https://www.virustotal.com/gui/file/$sha256"
            $stats = $analysis.data.attributes.stats
            if ($stats) {
              $detections = [int]$stats.malicious + [int]$stats.suspicious
              $total = 0
              foreach ($property in $stats.PSObject.Properties) {
                $total += [int]$property.Value
              }
              $summary = "$detections/$total engines at publish time"
            } else {
              $summary = "analysis still running at publish time"
            }
            $lines += "- $($target.Label): $permalink ($summary)"
            Start-Sleep -Seconds 16
          }

          $notesPath = Join-Path $PWD "release-notes.md"
          gh release view "$env:RELEASE_TAG" `
            --repo "${{ github.repository }}" `
            --json body `
            --jq .body | Set-Content $notesPath
          $notes = Get-Content $notesPath -Raw
          $notes = $notes -replace '(?ms)\r?\n## VirusTotal\s*\r?\n.*\z', ''
          Set-Content $notesPath $notes.TrimEnd()
          Add-Content $notesPath ($lines -join "`n")
          gh release edit "$env:RELEASE_TAG" `
            --repo "${{ github.repository }}" `
            --notes-file $notesPath
