name: release

# Tag-triggered player prerelease: pushing v* (e.g. v0.1.0-playtest.1) builds
# the full Windows launcher package -- launcher, native tools, CE table, and
# the bb-ap-client built from the client repo's main -- and attaches the zip
# plus bloodborne.apworld to a GitHub prerelease, so a playtester needs no
# GitHub login to download.
#
# The suppression binder is built here too, from the committed inputs bundle
# (#138/#164), held to the world's plan pin, and bundled into the zip via
# -SuppressionBuild -- so the prerelease is self-contained. The binder is
# licensed-game-derived; this repository already commits the same data in
# research/bb_inputs.db, so the zip adds no new exposure.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.1.0-playtest.1)"
        required: true
      client_ref:
        description: "from-software-archipelago-clients ref to build"
        default: "main"
      scan_only:
        description: "Rescan an existing release without rebuilding it"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    name: player prerelease package
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.scan_only }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the release tag
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ("${{ github.ref_type }}" -eq "tag") { $tag = "${{ github.ref_name }}" }
          if (-not $tag.StartsWith("v")) { throw "release tags must start with v: $tag" }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Fetch the pinned SoulsFormatsNEXT packaging dependency
        shell: pwsh
        run: |
          git clone https://github.com/4laric/SoulsFormatsNEXT.git _soulsformats
          git -C _soulsformats checkout 7cef52a7366678448d85930eeb8e94093b179d24

      - name: Check out the AP client
        uses: actions/checkout@v4
        with:
          repository: 4laric/from-software-archipelago-clients
          ref: ${{ github.event.inputs.client_ref || 'main' }}
          path: _client

      - name: Resolve the AP client build stamp
        id: client-sha
        shell: pwsh
        run: |
          $sha = git -C _client rev-parse HEAD
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build the AP client (cargo release)
        shell: pwsh
        env:
          BB_BUILD_SHA: ${{ steps.client-sha.outputs.sha }}
        run: cargo build --release -p bb-archipelago --manifest-path _client/Cargo.toml

      - name: Install the pinned Windows packager
        run: python -m pip install --disable-pip-version-check -r packaging/requirements-build.txt

      - name: Build the suppression binder from the inputs bundle
        shell: pwsh
        run: |
          python tools/bb_inputs.py --verify
          python tools/bb_inputs.py --extract work/inputs
          ./tools/build_vanilla_suppression.ps1 `
            -GameParam work/inputs/parambnd/gameparam.parambnd.dcx `
            -Paramdef work/inputs/parambnd/paramdef.paramdefbnd.dcx `
            -OutputRoot work/release-binder `
            -SoulsFormatsNextRoot $PWD\_soulsformats `
            -Apply
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: The binder plan matches the pin the world ships
        shell: pwsh
        run: python tools/check_suppression_plan_pin.py --manifest work/release-binder/build-manifest.json

      - name: Build the launcher package
        shell: pwsh
        run: >-
          ./packaging/build_launcher.ps1
          -SoulsFormatsNextRoot $PWD\_soulsformats
          -ClientPath $PWD\_client\target\release\bb-ap-client.exe
          -SuppressionBuild $PWD\work\release-binder

      - name: Package the apworld
        shell: pwsh
        run: ./build.ps1 -Apworld

      - name: Attest the release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            build/BloodborneAPLauncher-win-x64.zip
            build/bloodborne.apworld

      - name: Hash the release artifacts
        shell: pwsh
        run: |
          $lines = @("", "## Artifact hashes (SHA-256, built by this workflow run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID)")
          foreach ($f in "build\BloodborneAPLauncher-win-x64.zip","build\bloodborne.apworld") {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            $lines += "``$h``  $(Split-Path $f -Leaf)"
          }
          Add-Content packaging\PACKAGE-README.txt ($lines -join "`n")

      - name: Create the prerelease with the package zip
        shell: pwsh
        run: >-
          gh release create "$env:RELEASE_TAG"
          --repo ${{ github.repository }}
          --title "Bloodborne Archipelago $env:RELEASE_TAG"
          --notes-file packaging\PACKAGE-README.txt
          --prerelease
          build\BloodborneAPLauncher-win-x64.zip
          build\bloodborne.apworld
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  virustotal:
    name: publish VirusTotal results
    needs: package
    if: ${{ always() && (needs.package.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.scan_only)) }}
    runs-on: windows-latest
    continue-on-error: true
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
    steps:
      - name: Resolve the release tag
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ("${{ github.ref_type }}" -eq "tag") { $tag = "${{ github.ref_name }}" }
          if (-not $tag.StartsWith("v")) { throw "release tags must start with v: $tag" }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: VirusTotal API key is not configured
        if: env.VIRUSTOTAL_API_KEY == ''
        shell: pwsh
        run: Write-Warning "Skipping VirusTotal publication because VIRUSTOTAL_API_KEY is unavailable."

      - name: Scan release artifacts and publish permalinks
        if: env.VIRUSTOTAL_API_KEY != ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path scan -Force | Out-Null
          gh release download "$env:RELEASE_TAG" `
            --repo "${{ github.repository }}" `
            --dir scan `
            --pattern BloodborneAPLauncher-win-x64.zip `
            --pattern bloodborne.apworld

          $archive = Join-Path $PWD "scan\BloodborneAPLauncher-win-x64.zip"
          $expanded = Join-Path $PWD "scan\expanded"
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          $scanTargets = @(
            [pscustomobject]@{ Label = "BloodborneAPLauncher-win-x64.zip"; Path = $archive },
            [pscustomobject]@{ Label = "bloodborne.apworld"; Path = (Join-Path $PWD "scan\bloodborne.apworld") },
            [pscustomobject]@{ Label = "BloodborneAPLauncher.exe"; Path = (Join-Path $expanded "BloodborneAPLauncher\BloodborneAPLauncher.exe") },
            [pscustomobject]@{ Label = "tools/bb-ap-client.exe"; Path = (Join-Path $expanded "BloodborneAPLauncher\tools\bb-ap-client.exe") },
            [pscustomobject]@{ Label = "tools/BBSuppressionWriter.exe"; Path = (Join-Path $expanded "BloodborneAPLauncher\tools\BBSuppressionWriter.exe") },
            [pscustomobject]@{ Label = "tools/BBEnemizerWriter.exe"; Path = (Join-Path $expanded "BloodborneAPLauncher\tools\BBEnemizerWriter.exe") },
            [pscustomobject]@{ Label = "tools/MSBBMiner.exe"; Path = (Join-Path $expanded "BloodborneAPLauncher\tools\MSBBMiner.exe") }
          )
          foreach ($target in $scanTargets) {
            if (-not (Test-Path -LiteralPath $target.Path -PathType Leaf)) {
              throw "VirusTotal scan target is missing: $($target.Label) ($($target.Path))"
            }
          }

          $headers = @{ "x-apikey" = $env:VIRUSTOTAL_API_KEY }
          $lines = @("", "## VirusTotal")
          foreach ($target in $scanTargets) {
            $path = Get-Item -LiteralPath $target.Path
            if ($path.Length -gt 32MB) {
              $uploadUrl = (Invoke-RestMethod `
                -Uri "https://www.virustotal.com/api/v3/files/upload_url" `
                -Headers $headers).data
            } else {
              $uploadUrl = "https://www.virustotal.com/api/v3/files"
            }

            # PowerShell 7.5's multipart encoder produced a body VirusTotal
            # rejected as malformed for the signed large-file upload URL.
            # curl's file form encoder is available on windows-latest and is
            # also the request shape documented by VirusTotal.
            $uploadJson = & curl.exe `
              --silent `
              --show-error `
              --fail-with-body `
              --request POST `
              --url $uploadUrl `
              --header "x-apikey: $env:VIRUSTOTAL_API_KEY" `
              --form "file=@$($path.FullName)"
            if ($LASTEXITCODE -ne 0) {
              throw "VirusTotal upload failed for $($path.Name) (curl exit $LASTEXITCODE)"
            }
            $upload = $uploadJson | ConvertFrom-Json
            if (-not $upload.data.id) {
              throw "VirusTotal upload returned no analysis id for $($path.Name)"
            }
            $analysisId = $upload.data.id
            $analysis = $null
            # Keep the public API cadence below four requests per minute even
            # when an analysis completes on the first poll.
            Start-Sleep -Seconds 16
            for ($attempt = 1; $attempt -le 12; $attempt++) {
              $analysis = Invoke-RestMethod `
                -Uri "https://www.virustotal.com/api/v3/analyses/$analysisId" `
                -Headers $headers
              if ($analysis.data.attributes.status -eq "completed") { break }
              Start-Sleep -Seconds 15
            }

            $sha256 = (Get-FileHash $path.FullName -Algorithm SHA256).Hash.ToLower()
            $permalink = "https://www.virustotal.com/gui/file/$sha256"
            $stats = $analysis.data.attributes.stats
            if ($stats) {
              $detections = [int]$stats.malicious + [int]$stats.suspicious
              $total = 0
              foreach ($property in $stats.PSObject.Properties) {
                $total += [int]$property.Value
              }
              $summary = "$detections/$total engines at publish time"
            } else {
              $summary = "analysis still running at publish time"
            }
            $lines += "- $($target.Label): $permalink ($summary)"
            Start-Sleep -Seconds 16
          }

          $notesPath = Join-Path $PWD "release-notes.md"
          gh release view "$env:RELEASE_TAG" `
            --repo "${{ github.repository }}" `
            --json body `
            --jq .body | Set-Content $notesPath
          $notes = Get-Content $notesPath -Raw
          $notes = $notes -replace '(?ms)\r?\n## VirusTotal\s*\r?\n.*\z', ''
          Set-Content $notesPath $notes.TrimEnd()
          Add-Content $notesPath ($lines -join "`n")
          gh release edit "$env:RELEASE_TAG" `
            --repo "${{ github.repository }}" `
            --notes-file $notesPath
