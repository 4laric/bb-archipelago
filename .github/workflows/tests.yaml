name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DEPS: >-
    pathspec pyyaml schema jellyfish websockets platformdirs typing_extensions
    orjson colorama certifi bsdiff4 jinja2

jobs:
  native-suppression-writer:
    name: native suppression writer builds
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Fetch the pinned SoulsFormatsNEXT writer dependency
        shell: pwsh
        run: |
          git clone https://github.com/4laric/SoulsFormatsNEXT.git _soulsformats
          git -C _soulsformats checkout 7cef52a7366678448d85930eeb8e94093b179d24
      - name: Build the native binder writer
        shell: pwsh
        run: >-
          dotnet build tools/bb_suppression_writer/BBSuppressionWriter.csproj
          -p:SoulsFormatsNextRoot=$PWD\_soulsformats
          -v:minimal

  # The binder the launcher validates, rebuilt from the repo alone (#138). The
  # world pins SUPPRESSION_PLAN_SHA256 into every seed and the launcher refuses
  # a binder whose manifest plan_sha256 disagrees, so this proves the repo can
  # still produce a binder that satisfies the seeds it generates. Built twice:
  # a binder CI cannot reproduce byte-for-byte is a binder nobody can check.
  suppression-binder:
    name: suppression binder from the inputs bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Fetch the pinned SoulsFormatsNEXT writer dependency
        shell: pwsh
        run: |
          git clone https://github.com/4laric/SoulsFormatsNEXT.git _soulsformats
          git -C _soulsformats checkout 7cef52a7366678448d85930eeb8e94093b179d24
      - name: Extract the inputs bundle
        shell: pwsh
        run: |
          python tools/bb_inputs.py --verify
          python tools/bb_inputs.py --extract work/inputs
      - name: Build the binder from bundled inputs, twice
        shell: pwsh
        run: |
          foreach ($n in 1, 2) {
            ./tools/build_vanilla_suppression.ps1 `
              -GameParam work/inputs/parambnd/gameparam.parambnd.dcx `
              -Paramdef work/inputs/parambnd/paramdef.paramdefbnd.dcx `
              -OutputRoot "work/binder$n" `
              -SoulsFormatsNextRoot $PWD\_soulsformats `
              -Apply
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      - name: The plan matches the pin the world ships
        shell: pwsh
        run: python tools/check_suppression_plan_pin.py --manifest work/binder1/build-manifest.json
      - name: The two builds agree byte-for-byte
        shell: pwsh
        run: |
          $a = (Get-Content work/binder1/build-manifest.json | ConvertFrom-Json).output_gameparam_sha256
          $b = (Get-Content work/binder2/build-manifest.json | ConvertFrom-Json).output_gameparam_sha256
          if ($a -ne $b) { Write-Error "binder output is not reproducible: $a vs $b"; exit 1 }
          Write-Host "binder $a reproduced"
      - uses: actions/upload-artifact@v4
        with:
          name: vanilla-suppression-binder
          path: |
            work/binder1/gameparam.parambnd.dcx
            work/binder1/build-manifest.json
            work/binder1/suppression-plan.json
          if-no-files-found: error

  launcher-package:
    name: Windows launcher package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Fetch the pinned SoulsFormatsNEXT packaging dependency
        shell: pwsh
        run: |
          git clone https://github.com/4laric/SoulsFormatsNEXT.git _soulsformats
          git -C _soulsformats checkout 7cef52a7366678448d85930eeb8e94093b179d24
      - name: Install the pinned Windows packager
        run: python -m pip install --disable-pip-version-check -r packaging/requirements-build.txt
      - name: Build the tools-only CI distribution
        shell: pwsh
        run: >-
          ./packaging/build_launcher.ps1
          -SoulsFormatsNextRoot $PWD\_soulsformats
          -SkipClient
      - uses: actions/upload-artifact@v4
        with:
          name: BloodborneAPLauncher-win-x64
          path: build/BloodborneAPLauncher-win-x64.zip
          if-no-files-found: error

  # Everything that does not need Archipelago. Most of the suite lives here.
  unit:
    name: unit (no Archipelago)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run the AP-free tier
        run: python tools/run_tests.py --expect-file tests/expected_counts.tsv

  # A contract change here reds nothing until someone touches the clients repo,
  # whose Contract::assert_agrees_with_crate guard only runs in the clients CI.
  # This job pulls the clients repo's vendored copy and fails on a semantic diff,
  # so drift reds in the PR that creates it. Separate job: its red is the
  # contract, not the test suite. No secrets: both repos are public and the copy
  # is fetched unauthenticated. A fetch failure fails the job (never a silent
  # green); raw.githubusercontent.com is not authenticated here, so an Actions
  # rate-limit would surface as a fetch failure and a re-run clears it.
  contract-drift:
    name: native-grant contract matches the clients copy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: The clients repo's vendored contract still agrees with ours
        run: python tools/check_contract_drift.py

  # The tier that skips itself when Archipelago is not importable. It only ever
  # runs here, so what it examined is asserted rather than assumed.
  archipelago:
    name: world + client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone Archipelago at the pin
        run: |
          PIN="$(cat .ap-version)"
          git clone --depth 1 --branch "$PIN" \
            https://github.com/ArchipelagoMW/Archipelago.git _ap
          # Verify by content, not by tag: a tag can move, __version__ cannot.
          grep -q "__version__ = \"$PIN\"" _ap/Utils.py \
            || { echo "checkout is not $PIN"; exit 1; }

      - name: Install headless dependencies
        run: pip install --no-cache-dir $PIP_DEPS

      # The world is installed the way Archipelago loads it, and tools/ and
      # research/ come along because the suite imports and reads them.
      - name: Install the world
        run: |
          rm -rf _ap/worlds/bloodborne
          cp -r worlds/bloodborne _ap/worlds/bloodborne
          cp -r bb_launcher tools tests research packaging _ap/
          cp build.ps1 _ap/

      - name: Run the suite inside Archipelago
        working-directory: _ap
        env:
          AP_NONINTERACTIVE: "1"
          SKIP_REQUIREMENTS_UPDATE: "1"
        run: |
          python tools/run_tests.py --expect-file tests/expected_counts_ap.tsv

  generate:
    name: generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Clone Archipelago at the pin
        run: |
          git clone --depth 1 --branch "$(cat .ap-version)" \
            https://github.com/ArchipelagoMW/Archipelago.git _ap
      - name: Install headless dependencies
        run: pip install --no-cache-dir $PIP_DEPS
      - name: Install the world
        run: |
          rm -rf _ap/worlds/bloodborne
          cp -r worlds/bloodborne _ap/worlds/bloodborne
          mkdir -p _ap/Players
          cp tests/players/*.yaml _ap/Players/

      # A yaml must generate cleanly or be rejected with a message a player can
      # act on. A FillError or a traceback is the bug, not the yaml.
      # stdin is /dev/null because Generate.py's atexit prompt otherwise hangs
      # the runner instead of failing it.
      - name: Generate across several seeds
        working-directory: _ap
        env:
          AP_NONINTERACTIVE: "1"
          SKIP_REQUIREMENTS_UPDATE: "1"
        run: |
          set -o pipefail
          for seed in 1 2 3 12345 99999; do
            echo "--- seed $seed ---"
            python Generate.py --player_files_path Players --outputpath out \
              --seed "$seed" --spoiler 3 < /dev/null 2>&1 | tee "gen-$seed.log"
            grep -q "^Done\." "gen-$seed.log" \
              || { echo "seed $seed did not complete"; exit 1; }
            if grep -q "FillError" "gen-$seed.log"; then
              echo "seed $seed produced a FillError"; exit 1
            fi
            # Stock Archipelago loads ~90 worlds and prints a traceback for any
            # that fail to import, so a bare grep for Traceback is somebody
            # else's bug. Only ours counts.
            if grep -qE "worlds[/.]bloodborne" "gen-$seed.log"; then
              echo "seed $seed produced a traceback naming this world"
              grep -nE -B5 "worlds[/.]bloodborne" "gen-$seed.log" | head -40
              exit 1
            fi
          done

      # The shipped artifact is the zipped apworld, and folder installs cannot
      # catch zip-import-only failures (resource reads via filesystem paths).
      # The player's install path is the zip: exercise it directly.
      - name: The zipped apworld imports and generates
        working-directory: _ap
        env:
          AP_NONINTERACTIVE: "1"
          SKIP_REQUIREMENTS_UPDATE: "1"
        run: |
          python - <<'PY'
          import pathlib, zipfile
          source = pathlib.Path("worlds/bloodborne")
          pathlib.Path("custom_worlds").mkdir(exist_ok=True)
          with zipfile.ZipFile("custom_worlds/bloodborne.apworld", "w") as archive:
              for path in sorted(source.rglob("*")):
                  if path.is_file() and "__pycache__" not in path.parts:
                      archive.write(path, f"bloodborne/{path.relative_to(source)}")
          PY
          rm -rf worlds/bloodborne
          set -o pipefail
          python Generate.py --player_files_path Players --outputpath out-zip \
            --seed 424242 --spoiler 0 < /dev/null 2>&1 | tee gen-zip.log
          grep -q "^Done\." gen-zip.log \
            || { echo "zipped apworld did not generate"; exit 1; }
          if grep -q "WorldSource(bloodborne" gen-zip.log; then
            echo "zipped apworld failed to import"
            grep -n -B2 -A15 "WorldSource(bloodborne" gen-zip.log | head -30
            exit 1
          fi

      # The seam between the two halves of the project: the world emits a
      # seed request (the launcher's identity document) and the planner can
      # consume it. bb-archipelago#149: every slot gets one, enemizer on or
      # off -- an enemizer-off slot without a request cannot launch at all.
      - name: The seed request is emitted for every slot and well formed
        working-directory: _ap
        run: |
          python - <<'PY'
          import glob, json, zipfile
          zips = sorted(glob.glob("out/*.zip"))
          assert zips, "no output produced"
          expected = {"Tester", "NoEnemizer"}
          for path in zips:
              archive = zipfile.ZipFile(path)
              seen = set()
              for name in archive.namelist():
                  if not name.endswith(".bbseed.json"):
                      continue
                  payload = json.loads(archive.read(name))
                  assert payload["format"] == "bb-seed-request-v1", payload
                  assert payload["enemizer_seed"], "the planner is seeded from this"
                  assert payload["player"] and payload["player_name"]
                  # bb-archipelago#150: enemization is a launch-time decision,
                  # not a seed term. The key must not come back.
                  assert "enemizer" not in payload, (name, payload.get("enemizer"))
                  # bb-archipelago#205/#207. The Players yamls are the control
                  # pair: NoEnemizer has uncanny_weapons on, Tester has it off,
                  # so the option's effect on the emitted pool is visible here
                  # rather than only in unit tests. Wave 1 (#207) makes the
                  # default pool the 20 base-game weapons (15 trick weapons +
                  # 5 firearms); the option adds one Uncanny variant per trick
                  # weapon and nothing for firearms.
                  weapons = [row for row in payload["runtime_items"].values()
                             if row["item_category"] == 0]
                  expected_weapons = 35 if payload["player_name"] == "NoEnemizer" else 20
                  assert len(weapons) == expected_weapons, (
                      name, payload["player_name"], len(weapons))
                  # Wave 1's goods half: the filler mix is many category-4 rows,
                  # not the four canaries plus Blood Vial it used to be.
                  goods = [row for row in payload["runtime_items"].values()
                           if row["item_category"] == 4]
                  assert len(goods) == 27, (name, payload["player_name"], len(goods))
                  seen.add(payload["player_name"])
              assert seen == expected, (path, seen)
          print(f"{len(zips)} seed(s): one request per slot, enemizer on and off")
          PY

      # NOTE: this leg proves the request is emitted and well formed, but the
      # planner's real input is a mined MSB inventory, which no leg can produce
      # from licensed game files. The synthetic end-to-end leg below closes that
      # gap by mining forged maps instead.

  # The whole format chain against forged fixtures: mine synthetic MSBs, plan
  # from the mined inventory, write the plan back into the MSBs, re-mine to
  # prove the swaps landed, then run the real suppression planner and apply its
  # plan to a synthetic gameparam/paramdef pair. No licensed bytes are involved;
  # the fixtures are generated fresh by tools/bb_fixture_forge on every run, so
  # a format break in any tool fails this leg instead of a player's session.
  integration:
    name: synthetic end-to-end chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Fetch the pinned SoulsFormatsNEXT dependency
        run: |
          git clone https://github.com/4laric/SoulsFormatsNEXT.git _soulsformats
          git -C _soulsformats checkout 7cef52a7366678448d85930eeb8e94093b179d24
      - name: Build the native tools
        run: |
          set -e
          for project in \
            tools/bb_fixture_forge/BBFixtureForge.csproj \
            tools/msbb_miner/MSBBMiner.csproj \
            tools/bb_enemizer_writer/BBEnemizerWriter.csproj \
            tools/bb_suppression_writer/BBSuppressionWriter.csproj; do
            dotnet build "$project" -c Release \
              -p:SoulsFormatsNextRoot="$PWD/_soulsformats" -v:minimal
          done
      - name: Forge the synthetic fixtures
        run: |
          python tools/plan_vanilla_suppression.py --output work/integration/suppression-plan.json
          dotnet run --project tools/bb_fixture_forge -c Release --no-build -- \
            work/integration/fixtures --suppression-plan work/integration/suppression-plan.json
      - name: Mine the forged maps
        run: >
          dotnet run --project tools/msbb_miner -c Release --no-build
          -p:SoulsFormatsNextRoot="$PWD/_soulsformats" --
          work/integration/fixtures/mapstudio work/integration/mined
      - name: The mined inventory is what the forge placed
        run: |
          python - <<'PY'
          import csv
          rows = list(csv.DictReader(open("work/integration/mined/msb_enemies.tsv", encoding="utf-8"), delimiter="\t"))
          names = {row["part_name"] for row in rows}
          assert len(rows) == 8, f"expected 8 enemy rows across two maps, got {len(rows)}"
          assert {"c1000_0000", "c2000_0000", "c3000_0000", "c9000_0000"} <= names, names
          print(f"mined {len(rows)} enemy rows from the forged maps")
          PY
      - name: Plan from the mined inventory
        run: >
          python -m tools.bb_enemizer.cli
          --inventory work/integration/mined/msb_enemies.tsv
          --ap-request tests/fixtures/enemizer-request.json
          --output work/integration/enemizer-plan.json
      - name: The plan swaps the randomizable slots and protects the rest
        run: |
          python - <<'PY'
          import json
          plan = json.load(open("work/integration/enemizer-plan.json", encoding="utf-8"))
          assert plan["format"] == "bb-enemizer-plan-v2", plan["format"]
          swaps = {swap["logical_key"]: swap for swap in plan["swaps"]}
          assert set(swaps) == {"m99_00_00_00:c1000_0000", "m99_00_00_00:c2000_0000"}, swaps
          for swap in swaps.values():
              # one shared choice across both alternate map states
              assert len(swap["destination_keys"]) == 2, swap
              assert swap["source"]["model_name"] != swap["target"]["model_name"], swap
          reasons = {rejection["reason"] for rejection in plan["rejections"]}
          assert any("talk-bound" in reason for reason in reasons), reasons
          assert any("dummy" in reason for reason in reasons), reasons
          print(f"swaps={len(swaps)} rejections={len(plan['rejections'])} as forged")
          PY
      - name: Write the enemizer plan into the forged maps
        run: >
          dotnet run --project tools/bb_enemizer_writer -c Release --no-build
          -p:SoulsFormatsNextRoot="$PWD/_soulsformats" --
          work/integration/enemizer-plan.json work/integration/fixtures/mapstudio
          work/integration/written-mapstudio --apply
      - name: Re-mining the written maps shows the swaps
        run: |
          dotnet run --project tools/msbb_miner -c Release --no-build \
            -p:SoulsFormatsNextRoot="$PWD/_soulsformats" -- \
            work/integration/written-mapstudio work/integration/remined
          python - <<'PY'
          import csv, json
          plan = json.load(open("work/integration/enemizer-plan.json", encoding="utf-8"))
          rows = list(csv.DictReader(open("work/integration/remined/msb_enemies.tsv", encoding="utf-8"), delimiter="\t"))
          by_key = {f"{row['map_name']}:{row['part_name']}": row for row in rows}
          for swap in plan["swaps"]:
              target = swap["target"]
              for key in swap["destination_keys"]:
                  row = by_key[key]
                  actual = (row["model_name"], int(row["npc_param_id"]), int(row["think_param_id"]), int(row["chara_init_id"]))
                  wanted = (target["model_name"], target["npc_param_id"], target["think_param_id"], target["chara_init_id"])
                  assert actual == wanted, f"{key}: {actual} != {wanted}"
          print("all swapped destinations carry the planned archetype after a full write/re-mine cycle")
          PY
      - name: Apply the suppression plan to the forged gameparam
        run: >
          dotnet run --project tools/bb_suppression_writer -c Release --no-build
          -p:SoulsFormatsNextRoot="$PWD/_soulsformats" --
          work/integration/suppression-plan.json
          work/integration/fixtures/param/gameparam.parambnd.dcx
          work/integration/fixtures/paramdef/paramdef.paramdefbnd.dcx
          work/integration/gameparam.suppressed.parambnd.dcx --apply

  # The control that makes the inputs bundle trustworthy: extract it, re-run the
  # derivation, and require the committed research to be exactly what came out.
  # Without this, "the bundle reproduces the research" is a claim, and the first
  # silent divergence makes every number downstream unfalsifiable.
  research:
    name: research regenerates from the bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: The bundle is intact and covers what the tools read
        run: |
          python tools/bb_inputs.py --verify
          python tools/bb_inputs.py --check-coverage

      # A param writer that cannot reproduce its own input has no business
      # modifying it. This runs against the real 2 MB table, not a fixture.
      - name: The param writer round-trips losslessly
        run: python tools/apply_vanilla_suppression.py --check

      # The slice-3 flag audit is a claim about the corpus, so it is checked
      # against the corpus rather than trusted as a committed file (#158).
      - name: The slice-3 witness audit still says what the corpus says
        run: python tools/audit_slice3_witnesses.py --check

      - name: Extract and re-run the param joins
        run: |
          python tools/bb_inputs.py --extract work/inputs
          python tools/mine_param_joins.py work/inputs/params work/inputs/mined research/joined

      - name: The committed research is what the tools produce
        run: |
          if ! git diff --exit-code -- research/joined; then
            echo
            echo "research/joined differs from what the bundle regenerates."
            echo "Either the tools changed and the outputs were not refreshed,"
            echo "or the bundle is stale. Both are real; neither is cosmetic."
            exit 1
          fi
