description: Bloodborne Central Yharnam varied-grant playtest
name: VarietyTester
game: Bloodborne
Bloodborne:
  progression_balancing: 50
  accessibility: items
  auto_upgrade: false
  auto_equip: false
  full_item_pool: true
  # Uncanny variants of your pooled weapons, normally Chalice-only (#205).
  # They replace filler, so the seed keeps its size. Off by default.
  uncanny_weapons: false
  # Independent native choices in Hunter's Dream (3 trick weapons, 2 firearms).
  randomize_starting_weapons: true
  # Remove Strength, Skill, Bloodtinge, and Arcane equip gates; scaling remains.
  remove_weapon_requirements: true
  # Ending goal: submit_to_gehrman, refuse_gehrman, or moon_presence.
  goal: moon_presence
